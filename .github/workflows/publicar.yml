name: Publicar fontes da reforma

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"   # toda segunda, 07h de Brasília: rebaixa as normas

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 lxml pdfplumber

      - name: Gerar site
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          export SITE_BASE_URL="https://${OWNER}.github.io/${REPO}"
          echo "SITE_BASE_URL=$SITE_BASE_URL"
          python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: urls
          path: _site/urls.txt

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

      - uses: actions/download-artifact@v4
        with:
          name: urls
          path: _site

      - name: Avisar o Bing (IndexNow)
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          export SITE_BASE_URL="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          sleep 60
          pip install requests
          python scripts/indexnow.py
